server:
  port: 8484

spring:
  application:
    name: auth
  web:
    error:
      include-message: always
  sql:
    init:
      mode: always
      platform: postgres
  profiles:
    active: niklas



cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}


app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins:  http://localhost:63342
